# Gradle was set to -Xmx8G with 4G metaspace: up to 12G on a 16G machine.
# A build could take nearly all available RAM, and Android's low-memory killer
# would take the emulator down with it. 3G is generous for a project this size
# (Gradle's own default is well under 2G) and leaves room to run a build and
# the emulator at the same time.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Reuse build outputs between runs. Costs disk, not memory, and takes back
# some of the speed lost by the smaller heap.
org.gradle.caching=true

android.useAndroidX=true
