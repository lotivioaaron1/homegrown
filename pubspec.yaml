name: homegrown
description: Homegrown Community Mobile App Platform for Homegrown Athletes in Legazpi City, Albay

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^6.0.3
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_crashlytics: ^4.1.3

  # Maps & Location
  google_maps_flutter: ^2.5.0      # Keep for future use
  http: ^1.2.0
  geolocator: ^13.0.1
  url_launcher: ^6.1.10
  
  # Authentication
  google_sign_in: ^6.2.1

  # UI
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  lucide_icons_flutter: ^3.1.15
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1

  # Media
  # video_compress transcodes highlight clips to ~720p before upload and also
  # supplies duration metadata and the poster-frame thumbnail, so one package
  # covers all three needs. video_player is the official flutter.dev plugin,
  # used only for playback in the highlight viewer.
  video_compress: ^3.1.4
  video_player: ^2.9.2

  # Utils
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  get: ^4.6.6
  uuid: ^4.5.1
  flutter_image_compress: ^2.5.1
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Regenerate the Android launcher icons with:
#   dart run flutter_launcher_icons
#
# Sources live in assets/launcher_icon/ rather than assets/images/, which is
# declared above and so ships inside the APK — these are build-time inputs and
# have no business being bundled at runtime. Both are derived from
# assets/images/homegrown_icon.png; regenerate them from that master if the
# logo changes (see the comment in android/app/src/main/res for the geometry).
#
# The background is white because the wordmark's counters — the H's crossbar
# gaps and the G's bowl — are transparency, not white fill. On brand gold the
# gold G's counter would fill gold and the letter would close into a blob; on
# near-black the near-black H would disappear. White is the only flat ground
# where both letters keep their shape, and it matches wordmark_on_light.png.
flutter_launcher_icons:
  android: true
  ios: false
  # Legacy square icon for API 24–25, which predate adaptive icons. The white
  # ground is baked in, since a transparent legacy icon renders as a hole.
  image_path: "assets/launcher_icon/legacy.png"
  adaptive_icon_background: "#FFFFFF"
  # The mark is scaled to 50% of the 108dp layer so the whole 1.617:1 lockup
  # inscribes in the 66dp safe circle. At the default size it overflowed the
  # 72dp viewport and lost the speed lines and the right edge of the G to the
  # mask on round launchers.
  adaptive_icon_foreground: "assets/launcher_icon/foreground.png"
  # Android 13+ themed icons tint the alpha channel of this layer, so the same
  # transparent foreground doubles as the monochrome silhouette.
  adaptive_icon_monochrome: "assets/launcher_icon/foreground.png"
  min_sdk_android: 24