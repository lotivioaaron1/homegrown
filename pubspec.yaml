name: homegrown
description: Homegrown Community Mobile App Platform for Homegrown Athletes in Legazpi City, Albay

publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^6.0.3
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_crashlytics: ^4.1.3

  # Maps & Location
  google_maps_flutter: ^2.5.0      # Keep for future use
  http: ^1.2.0
  geolocator: ^13.0.1
  url_launcher: ^6.1.10
  
  # Authentication
  google_sign_in: ^6.2.1

  # UI
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  lucide_icons_flutter: ^3.1.15
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1

  # Media
  # video_compress transcodes highlight clips to ~720p before upload and also
  # supplies duration metadata and the poster-frame thumbnail, so one package
  # covers all three needs. video_player is the official flutter.dev plugin,
  # used only for playback in the highlight viewer.
  video_compress: ^3.1.4
  video_player: ^2.9.2

  # Utils
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  get: ^4.6.6
  uuid: ^4.5.1
  flutter_image_compress: ^2.5.1
  cloud_functions: ^5.6.2

  # Event reminders. These schedule notifications with the OS itself, so a
  # "your game starts in an hour" alert arrives with the app closed without
  # needing Cloud Functions, FCM or a billing plan. timezone is required by
  # the plugin's zonedSchedule; see EventReminderService for why the zone is
  # pinned to Asia/Manila.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Regenerate the Android launcher icons with:
#   dart run flutter_launcher_icons
#
# The three PNGs below are NOT hand-drawn — redraw them with:
#   flutter test tool/generate_launcher_icons.dart \
#     --dart-define=concept=m1 --dart-define=colorway=inkPlate
# That tool holds the mark as vector geometry, so it stays sharp at any size
# instead of being resampled from a bitmap. concept is one of m1/m2/m3/m4 —
# the motion treatments — and colorway is inkPlate or goldPlate.
#
# Sources live in assets/launcher_icon/ rather than assets/images/, which is
# declared above and so ships inside the APK — these are build-time inputs and
# have no business being bundled at runtime.
#
# The mark is the "HG" monogram: the name is the only thing that is uniquely
# this app's, which is why two pictorial marks were tried and dropped before it.
# The letters are constructed geometrically rather than set in a typeface, since
# nothing is bundled and google_fonts fetches at runtime.
#
# Two details are load-bearing:
#   - The H sits ON TOP of the G, so the gap is cut out of the G. Cutting it the
#     other way round ate the H's right leg.
#   - That gap exists at all because Android 13+ themed icons flatten both
#     letters to a single tint; touching letters would fuse into one blob.
flutter_launcher_icons:
  android: true
  ios: false
  # Legacy square icon for API 24–25, which predate adaptive icons. The plate
  # is baked in, since a transparent legacy icon renders as a hole.
  image_path: "assets/launcher_icon/legacy.png"
  # Near-black, matching the splash background in splash_screen.dart. The ink
  # plate is what lets the H and the G stay two different colours — white and
  # brand gold — which is the relationship the original artwork had. On a gold
  # plate both letters have to be ink and that distinction is lost.
  adaptive_icon_background: "#07070C"
  # Sizing, which is what the old icon got wrong: this file fills the 108dp
  # layer, the generated anydpi-v26 XML insets it 16% leaving 73.44dp of art,
  # and the launcher's safe circle is 66dp. Because the mask is a circle the
  # generator fits the mark's MINIMUM ENCLOSING CIRCLE, not its bounding box,
  # to 82% of the canvas against a hard ceiling of 66/73.44 = 89.9%. Measured
  # on the artwork here that is a 30.10dp radius inside the 33dp safe radius.
  # The wordmark was configured at 50% of the layer, i.e. 36.7dp across inside
  # a 66dp circle — roughly 31% of the visible area, which is why it looked
  # small and timid next to other apps.
  adaptive_icon_foreground: "assets/launcher_icon/foreground.png"
  # Android 13+ themed icons tint this layer's alpha channel. It must be its
  # OWN file: this previously pointed at the foreground, so every themed icon
  # flattened the H, the G and all the speed lines into one solid unreadable
  # tint. Here the house silhouette carries the shape and the H stays a hole.
  adaptive_icon_monochrome: "assets/launcher_icon/monochrome.png"
  min_sdk_android: 24